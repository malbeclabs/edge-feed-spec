name: conformance ci

on:
  pull_request:
    paths:
      - "tools/conformance/**"
      - ".github/workflows/ci.yml"
  push:
    branches:
      - main
    paths:
      - "tools/conformance/**"
      - ".github/workflows/ci.yml"

permissions:
  contents: read

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: setup go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: "1.25.x"
          cache-dependency-path: tools/conformance/go.sum

      - name: golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.11
          working-directory: tools/conformance

  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: setup go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: "1.25.x"
          cache-dependency-path: tools/conformance/go.sum

      - name: test
        working-directory: tools/conformance
        env:
          TMPDIR: /tmp
        run: go test ./...

  # The shipped alert rules had no coverage, and the coverage alerts are exactly
  # the kind that fail silently — one that never fires and one that fires so
  # routinely it gets muted look identical until an incident. promtool checks the
  # rules parse and unit-tests both properties.
  alerts:
    name: alert rules
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: check and unit-test alert rules
        working-directory: tools/conformance
        run: |
          docker run --rm --entrypoint promtool -v "$PWD/prometheus:/p" \
            prom/prometheus:v3.6.0 check rules /p/alerts/conformance.yml
          docker run --rm --entrypoint promtool -v "$PWD/prometheus:/p" \
            prom/prometheus:v3.6.0 test rules /p/rule_tests/conformance_test.yml
