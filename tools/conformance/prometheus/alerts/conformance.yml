groups:
  - name: dz_conformance
    rules:
      # Page: any "must" rule violation in the last 5 minutes.
      # A single violation of a MUST rule means the feed is non-conformant.
      - alert: ConformanceMustViolation
        expr: increase(dz_conformance_violations_total{severity="must"}[5m]) > 0
        for: 0m
        labels:
          severity: page
        annotations:
          summary: "Conformance MUST violation on {{ $labels.feed }} feed"
          description: >
            Rule {{ $labels.rule_id }} (severity=must) fired on feed {{ $labels.feed }}.
            A MUST violation means the feed is non-conformant with the spec.

      # Warn: coverage is degrading for a reason the feed is responsible for.
      #
      # **Scoped by `reason`, and it has to be.** Not every unverifiable is a problem:
      # `cold_start` is an instrument adopting its first snapshot baseline and
      # `pending` is the mktdata and snapshot ports draining at their own rates —
      # both are routine on a healthy feed and both increment this counter on every
      # snapshot cycle. Alerting on the unlabelled total pages during normal
      # operation, which trains an operator to silence it. The causes below are the
      # ones that mean something is wrong upstream:
      #
      #   loss         a datagram went missing
      #   capture_loss the recorder admits it failed to record datagrams
      #   overflow     a bounded buffer was outrun (snapshot cycle too long for it)
      #   untrusted    an instrument's history never became established
      #
      # `capture_loss` reaches a scrape only from a replay run with --metrics-addr,
      # since a live socket has no such accounting to report. It is here because
      # when it does appear it is upstream in the same sense as the others — the
      # recorder rather than the wire — and a set that silently omitted it would be
      # a second place to keep in step with core.Reason*.
      #
      # See "Coverage vs. silence" in tools/conformance/README.md.
      - alert: ConformanceCoverageLoss
        expr: increase(dz_conformance_unverifiable_total{reason=~"loss|capture_loss|overflow|untrusted"}[5m]) > 5
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "Conformance coverage loss on {{ $labels.feed }} feed"
          description: >
            Rule {{ $labels.rule_id }} became unverifiable (reason={{ $labels.reason }})
            on feed {{ $labels.feed }}. Check feed health and instrument definitions.

      # Warn: a conditional rule has stopped passing while still getting work.
      #
      # This is the failure the reason-scoped alert above cannot see, and the one a
      # violation-only view is blind to by construction: a rule that never fires
      # because it never *runs*. The tool then reports a clean feed it is not
      # actually checking. Fires when a rule is being handed opportunities but none
      # of them resulted in a pass over the window.
      #
      # 15m rather than 5m because the snapshot cycle is the natural unit here —
      # a rule may legitimately go a cycle without a comparable opportunity.
      #
      # **`unless`, not `and ... == 0`.** A rule that has never once passed has no
      # `result="pass"` series at all, so `increase(...) == 0` matches no samples and
      # the alert would stay silent for exactly the rule in the worst state. `unless`
      # is a set difference: it keeps a rule whose pass series is missing *or* flat,
      # which is the condition being alerted on.
      #
      # `na` is excluded from the opportunity count deliberately — a rule reporting
      # not-applicable is not owed coverage (an instrument that declares no price
      # bound has nothing to bound-check), so counting those would page on a
      # perfectly healthy instrument set.
      - alert: ConformanceRuleNoLongerVerifying
        expr: >
          sum by (feed, rule_id) (
            increase(dz_conformance_checks_total{result=~"pass|violation|unverifiable"}[15m])
          ) > 10
          unless
          sum by (feed, rule_id) (
            increase(dz_conformance_checks_total{result="pass"}[15m])
          ) > 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Rule {{ $labels.rule_id }} is no longer verifying anything"
          description: >
            Rule {{ $labels.rule_id }} on feed {{ $labels.feed }} was handed work but
            produced no passing check in the last 15 minutes, so its clean result
            proves nothing. Check dz_conformance_unverifiable_total{rule_id="{{ $labels.rule_id }}"}
            for which cause is blocking it.

      # Warn: transport packet loss detected.
      - alert: ConformanceTransportLoss
        expr: increase(dz_conformance_transport_loss_total[5m]) > 0
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: "Transport loss on port {{ $labels.port }}"
          description: >
            Sequence-gap loss detected on multicast port {{ $labels.port }}.
            This may indicate network congestion or switch misconfiguration.

      # Warn: conformance tool not reachable (scrape target down).
      # Uses the synthetic `up` metric Prometheus sets per scrape — more
      # reliable than absent() which is delayed by the staleness window.
      - alert: ConformanceDown
        expr: up{job="dz-conformance"} == 0
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "dz-conformance scrape target is down"
          description: >
            Prometheus cannot reach the dz-conformance metrics endpoint.
            Check that the container is running and --metrics-addr matches
            the target in tools/conformance/prometheus/prometheus.yml.
